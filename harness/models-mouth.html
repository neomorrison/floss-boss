<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Mouth and tool models</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e9f4f1; font-family: Nunito, system-ui, sans-serif; color: #16323a; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #labels { position: fixed; inset: 0; pointer-events: none; }
    .lbl { position: absolute; font-size: 12px; font-weight: 700; line-height: 1.2; padding: 3px 6px; }
    .lbl small { display: block; font-weight: 600; opacity: 0.65; font-size: 10.5px; }
    .lbl.bad { color: #c0254a; }
    #bar { position: fixed; left: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
    #bar a { background: #fff; border-radius: 10px; padding: 8px 12px; text-decoration: none; color: #16323a; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.15); min-height: 20px; }
    #bar a.on { background: #3dd6b5; }
    #info { position: fixed; right: 10px; bottom: 8px; font-size: 12px; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="labels"></div>
  <div id="bar"></div>
  <div id="info"></div>
  <script type="module" src="./models-mouth.ts"></script>
</body>
</html>
