<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Clinic Harness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #EAF7F3; font-family: Nunito, system-ui, sans-serif; color: #16323A; overscroll-behavior: none; }
    #view { position: fixed; inset: 0; }
    #panel { position: fixed; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(640px, calc(100vw - 20px)); z-index: 5; }
    #panel button { font: 800 13px/1 Nunito, system-ui, sans-serif; border: 0; border-radius: 12px; padding: 9px 12px; background: #fff; color: #16323A; box-shadow: 0 2px 8px rgba(22,50,58,.16); cursor: pointer; min-height: 36px; }
    #panel button.on { background: #0E8F8A; color: #fff; }
    #hud { position: fixed; right: 10px; top: 10px; background: #fff; border-radius: 14px; padding: 8px 12px; font: 800 14px/1.3 Nunito, system-ui, sans-serif; box-shadow: 0 2px 8px rgba(22,50,58,.16); z-index: 5; text-align: right; }
    #hud small { font-weight: 700; color: #4d6a72; display: block; max-width: 240px; }
    body.clean #panel, body.clean #hud { display: none; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="panel"></div>
  <div id="hud"></div>
  <script type="module" src="./clinic.ts"></script>
</body>
</html>
