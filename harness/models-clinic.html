<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Clinic and people models</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e9f4f1; font-family: Nunito, system-ui, sans-serif; color: #16323a; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #labels { position: fixed; inset: 0; pointer-events: none; }
    .lbl { position: absolute; transform: translate(-50%, 0); text-align: center; font-size: 11.5px; font-weight: 700; line-height: 1.15; padding: 2px 5px; background: rgba(255, 255, 255, 0.72); border-radius: 6px; white-space: nowrap; }
    .lbl small { display: block; font-weight: 600; opacity: 0.65; font-size: 10px; }
    .lbl.bad { color: #c0254a; }
    #bar { position: fixed; left: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
    #bar a { background: #fff; border-radius: 10px; padding: 10px 14px; text-decoration: none; color: #16323a; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.15); min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; }
    #bar a.on { background: #3dd6b5; }
    #info { position: fixed; right: 10px; bottom: 8px; font-size: 12px; opacity: 0.75; }
    #thumbs { position: fixed; inset: 60px 16px 16px; overflow: auto; display: none; }
    #thumbs .row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
    #thumbs figure { margin: 0; width: 150px; text-align: center; font-size: 12px; font-weight: 700; }
    #thumbs .card { width: 150px; height: 150px; border-radius: 18px; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(22,50,58,.15); }
    #thumbs .card img { width: 128px; height: 128px; }
    #thumbs .light { background: #fffdf7; }
    #thumbs .mint { background: #bff0e3; }
    #thumbs .dark { background: #16323a; }
    #thumbs figcaption small { display: block; font-weight: 600; opacity: 0.6; }
    #thumbs figcaption.bad { color: #c0254a; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="labels"></div>
  <div id="thumbs"></div>
  <div id="bar"></div>
  <div id="info"></div>
  <script type="module" src="./models-clinic.ts"></script>
</body>
</html>
